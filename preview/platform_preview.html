    function AuditPage() {
      const [form] = Form.useForm();
      const [dataSource, setDataSource] = useState(mockData.myParams);
      const [currentPage, setCurrentPage] = useState(1);
      const [pageSize] = useState(10);
      const [filters, setFilters] = useState({});
      const [auditModalVisible, setAuditModalVisible] = useState(false);
      const [selectedRecord, setSelectedRecord] = useState(null);
      const [auditForm] = Form.useForm();

      const filteredData = useMemo(() => {
        return dataSource.filter(item => {
          if (filters.scene && !item.scene.includes(filters.scene)) return false;
          if (filters.auditResult !== undefined && item.auditResult !== filters.auditResult) return false;
          if (filters.applicant && !item.applicant.includes(filters.applicant)) return false;
          return true;
        });
      }, [dataSource, filters]);

      const paginatedData = useMemo(() => {
        const start = (currentPage - 1) * pageSize;
        return filteredData.slice(start, start + pageSize);
      }, [filteredData, currentPage, pageSize]);

      const handleSearch = () => {
        const values = form.getFieldsValue();
        setFilters(values);
        setCurrentPage(1);
      };

      const handleReset = () => {
        form.resetFields();
        setFilters({});
        setCurrentPage(1);
      };

      const handleAudit = (record) => {
        setSelectedRecord(record);
        auditForm.setFieldsValue({ auditResult: 0, auditRemark: '' });
        setAuditModalVisible(true);
      };

      const handleAuditSubmit = () => {
        auditForm.validateFields().then(values => {
          setDataSource(dataSource.map(item => item.id === selectedRecord.id ? { ...item, auditResult: values.auditResult, auditRemark: values.auditRemark, auditor: 'admin', auditTime: dayjs().format('YYYY-MM-DD HH:mm') } : item));
          setAuditModalVisible(false);
          message.success(values.auditResult === 1 ? '审核通过' : '已驳回');
        });
      };

      const columns = [
        { title: '参数应用场景', dataIndex: 'scene', width: 140 },
        { title: '参数值', dataIndex: 'value', width: 150 },
        { title: '参数名', dataIndex: 'parameterName', width: 180 },

          <div className="toolbar">
            <Form form={form} layout="inline" className="filter-form">

              <Form.Item label="申请人" name="applicant"><Input placeholder="请输入申请人" style={{ width: 120 }} /></Form.Item>
            </Form>
            <div className="toolbar-actions">
              <Button onClick={handleSearch}>查询</Button>
              <Button onClick={handleReset}>重置</Button>

          <Modal title={selectedRecord?.auditResult === 0 ? '审核参数' : '查看审核详情'} open={auditModalVisible} onOk={handleAuditSubmit} onCancel={() => setAuditModalVisible(false)} okText={selectedRecord?.auditResult === 0 ? '提交审核' : '关闭'}>

                  <Descriptions.Item label="参数使用说明">{selectedRecord.usage}</Descriptions.Item>
                  <Descriptions.Item label="申请人">{selectedRecord.applicant}</Descriptions.Item>
                  <Descriptions.Item label="提交时间">{formatDateTime(selectedRecord.submittedAt)}</Descriptions.Item>

                {selectedRecord.auditResult === 0 && (
                  <Form form={auditForm} layout="vertical" className="modal-form">
                    <Form.Item label="审核结果" name="auditResult" rules={[{ required: true, message: '请选择审核结果' }]}>
                      <Select options={[{ label: '通过', value: 1 }, { label: '驳回', value: 2 }]} />

                  </div>
                )}
              </div>
            )}
          </Modal>
        </Card>
      );
    }

    function FeedbackModal() {
      const [visible, setVisible] = useState(false);
      const [form] = Form.useForm();

      const handleSubmit = () => {
        form.validateFields().then(values => {
          const blob = new Blob([JSON.stringify(values, null, 2)], { type: 'application/json' });
          const url = URL.createObjectURL(blob);
          const a = document.createElement('a');
          a.href = url;
          a.download = `需求反馈_${dayjs().format('YYYYMMDD_HHmmss')}.json`;
          a.click();
          URL.revokeObjectURL(url);
          setVisible(false);
          form.resetFields();
          message.success('反馈已下载');
        });
      };

      return (
        <>
          <div className="feedback-btn" onClick={() => setVisible(true)} title="需求反馈">💡</div>

      const menuItems = [
        { key: 'placement-params', icon: '📊', label: '投放参数管理' },
        { key: 'my-audit', icon: '📋', label: '我的参数审核' },
        { key: 'conv-nodes', icon: '🔗', label: '回传节点管理' },
        { key: 'delivery-links', icon: '🔗', label: '投放链接管理' },
      ];

      const renderContent = () => {
        switch (currentKey) {
          case 'placement-params': return <PlacementParamPage />;
          case 'my-audit': return <AuditPage />;
          case 'conv-nodes': return <ConvNodePage />;
          case 'delivery-links': return <DeliveryLinkPage />;
          default: return <PlacementParamPage />;
        }
      };

      const getPageTitle = () => {
        const item = menuItems.find(i => i.key === currentKey);
        return item ? item.label : '';
      };

      return (
        <div className="app-container">
          <div className="sidebar">
            <div className="logo">
              <div className="logo-icon">C</div>
              <span>渠道管理平台</span>
            </div>
            <div className="menu-group">核心功能</div>
            {menuItems.map(item => (
              <div key={item.key} className={`menu-item ${currentKey === item.key ? 'active' : ''}`} onClick={() => setCurrentKey(item.key)}>
                <span className="icon">{item.icon}</span>
                <span>{item.label}</span>
              </div>
            ))}
          </div>
          <div className="main">
            <div className="header">
              <div className="header-title">{getPageTitle()}</div>
              <div className="header-user">
                <span>{currentUser.name}</span>
                <div className="user-avatar">{currentUser.name[0]}</div>
              </div>
            </div>
            <div className="content">
              {renderContent()}
            </div>
          </div>
          <FeedbackModal />
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById('root')).render(<App />);
  </script>
</body>
</html>
